    Start:
    - '&9&l&n{parkour-name}'
    - '&9&lInicio del Parkour'
    End:
    - '&9&l&n{parkour-name}'
    - '&9&lFin del Parkour'
    Checkpoint:
    - '&9&l&n{parkour-name}'
    - '&9&lCheckpoint #{checkpoint}'
