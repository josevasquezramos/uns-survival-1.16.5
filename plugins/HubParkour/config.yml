      Header-Parkour: '&9&lTabla de Líderes de {parkour-name}'
      Header-Overall: '&9&lTabla de Líderes General de Todos los Parkours'
      Line: '&3#{place}&r - &b{player-name}&r - &b{player-time}'
  PlaceholderAPI:
    Position-Not-Filled: Posición no ocupada
    Not-Valid-Parkour: No es un parkour válido
    Not-Yet-Completed: Aún no completado
    Not-Yet-Finished: Aún no terminado
    Not-Yet-Filled: Posición no ocupada
    Not-In-Parkour: No estás en un parkour
    Not-Applicable: N/D
    Loading: Cargando...
    Not-Reached-Checkpoint: No has llegado a un checkpoint
  Signs:
    Sign-Deleted: El cartel ha sido eliminado exitosamente.
    Teleport:
    - '&2&l[PARKOUR]'
    - '&a{parkour-name}'
    - '{amount-of-players} jugadores'
    - ¡Clic para teletransportarse!
    Start:
    - '&2&l[PARKOUR]'
    - '&a{parkour-name}'
    - '{amount-of-players} jugadores'
    - ¡Clic para iniciar!
    Stats:
    - '&2&l[PARKOUR]'
    - '&a{parkour-name}'
    - ''
    - ¡Clic para ver estadísticas!
  Commands:
    Help:
    - 'Ayuda de Parkour:'
    - '&a/parkour reset &r- Te envía de vuelta al inicio.'
    - '&a/parkour checkpoint &r- Te teletransporta al último checkpoint alcanzado.'
    - '&a/parkour leave &r- Te hace abandonar el parkour.'
    - '&a/parkour leaderboard [parkour] &r- Ver la tabla de líderes de un parkour específico.'
    - '&a/parkour teleport [parkour] &r- Teletransportarse al inicio de un parkour.'
    - '&a/parkour stats <parkour> &r- Ver tus estadísticas generales o las de un parkour específico.'
    - '&a/parkour gui &r- Abrir la lista de Parkours en GUI.'
    Help-Admin:
    - '&a/parkour setup&r - Entrar al modo de configuración y empezar a crear un parkour.'
    - '&a/parkour done&r - Continuar con el asistente al configurar checkpoints.'
    - '&a/parkour input [texto]&r - Proporcionar entrada de texto al asistente cuando se solicite.'
    - '&a/parkour cancel&r - Cancelar la operación actual en el asistente.'
    - '&a/parkour delete [id o nombre del parkour] &r- Eliminar el parkour con el ID específico.'
    - '&a/parkour list&r - Listar todos los parkours activos.'
    - '&a/parkour hologram list&r - Listar todos los hologramas activos y sus IDs.'
    - '&a/parkour hologram create [id o nombre del parkour]&r - Colocar un holograma de tabla de líderes para el ID del parkour especificado, o general si no se especifica ninguno.'
    - '&a/parkour hologram delete [id del holograma]&r - Eliminar el holograma con el ID especificado.'
    - '&a/parkour removetime [id o nombre del parkour] [nombre del jugador]&r - Restablecer el tiempo de un jugador en la tabla de líderes.'
    - '&a/parkour cleartimes [id o nombre del parkour]&r - Limpiar completamente todos los tiempos de un parkour específico.'
    - '&a/parkour resettimes [nombre del jugador]&r - Restablecer completamente todos los tiempos de un jugador específico.'
    - '&a/parkour resetalltimes&r - Restablecer completamente todos los tiempos para todos los jugadores.'
    - '&a/parkour edit [id o nombre del parkour]&r - Habilitar el modo de edición para modificar información sobre un parkour.'
    - '&a/parkour reload &r- Recargar la configuración de HubParkour.'
    - '&a/parkour import &r- Importar la configuración de la base de datos SQLite a MySQL. Solo funciona si MySQL está vacío.'
    No-Permission: No tienes permiso para ejecutar este comando.
    Not-Valid-Parkour: Ese no es un parkour válido.
    Reset:
      Successful: Has sido teletransportado al inicio.
      Not-Started-Parkour: ¡Debes iniciar un parkour para poder reiniciarlo!
    Checkpoint:
      Successful: Has sido teletransportado a tu último checkpoint.
      Not-Started-Parkour: ¡Debes iniciar un parkour para teletransportarte a un checkpoint!
    Leaderboard:
      Message:
        Header: 'Los mejores tiempos son:'
        Line: '&a#{place} &r- &a{player-name} &r- &a{player-time} &rsegundos.'
        Footer: ''
      Not-Valid-Parkour: Ese no es un parkour válido.
    Leave:
      Left: Has abandonado el parkour y tu progreso ha sido restablecido.
      Not-In-Parkour: Debes haber iniciado un parkour para poder abandonarlo.
    Teleport:
      Not-Valid-Parkour: Ese no es un parkour válido.
      Currently-In-Parkour: No puedes teletransportarte al inicio de un parkour mientras estás en uno. Por favor, abandona tu parkour e inténtalo de nuevo.
      Teleported: Has sido teletransportado al punto de reinicio del parkour.
    Stats:
      Not-Valid-Parkour: Ese no es un parkour válido.
      No-Stats: Aún no se han registrado estadísticas para ti en ningún parkour. ¡Intenta uno para ganarlas!
      General-Stats:
      - 'Tus estadísticas generales:'
      - '&aIntentos de parkour:&r {attempts}'
      - '&aParkours completados:&r {completions}'
      - '&aSaltos totales:&r {jumps}'
      - '&aCheckpoints alcanzados:&r {checkpoints}'
      - '&aDistancia total recorrida:&r {distance} bloques'
      - '&aTiempo total en parkour:&r {time}'
      No-Parkour-Stats: Aún no se han registrado estadísticas para ti en este parkour. ¡Inténtalo para ganarlas!
      Parkour-Stats:
      - 'Tus estadísticas para el parkour &a{parkour-name}&r:'
      - '&aIntentos de parkour:&r {attempts}'
      - '&aParkours completados:&r {completions}'
      - '&aSaltos totales:&r {jumps}'
      - '&aCheckpoints alcanzados:&r {checkpoints}'
      - '&aDistancia total recorrida:&r {distance} bloques'
      - '&aTiempo total en parkour:&r {time}'
    GUI-Not-Enabled: El GUI de la lista de Parkours no está habilitado.
    Admin:
      No-Permission: No tienes permiso para realizar este comando.
      Reload-Success: La configuración del plugin ha sido recargada. Esta recarga no afecta a los hologramas, por favor reinicia tu servidor para que esos cambios surtan efecto.
      List:
        Header: 'Todos los parkours activos:'
        Line: '&aID: {id} &r- &a{parkour-name} &r- &a{parkour-players} &rjugadores activos.'
        Footer: ''
      Delete:
        Not-Valid-Parkour: Ese no es un ID de parkour válido. Si deseas ver una lista de todos los parkours y sus IDs, usa /parkour list.
        Success: Parkour eliminado exitosamente.
        Player-Kicked-From-Parkour: El parkour que estabas haciendo fue eliminado. Has abandonado el parkour.
      RemoveTime:
        Not-Valid-Parkour: Ese no es un ID de parkour válido. Si deseas ver una lista de todos los parkours y sus IDs, usa /parkour list.
        Not-Valid-Player: Ese jugador nunca ha intentado este parkour.
        Success: ¡El tiempo del jugador ha sido restablecido!
      ClearTimes:
        Not-Valid-Parkour: Ese no es un ID de parkour válido. Si deseas ver una lista de todos los parkours y sus IDs, usa /parkour list.
        Success: ¡Todos los tiempos de los jugadores han sido restablecidos para el parkour {parkour-name}!
      ResetTimes:
        Success: ¡Tiempos de todos los parkours restablecidos para el jugador {player-name}!
      ResetAllTimes:
        Success: ¡Se han restablecido todos los tiempos de todos los jugadores para todos los parkours!
      Import:
        Must-Be-MySQL: Debes tener el almacenamiento de base de datos MySQL activo para usar el comando de importación.
        Must-Be-Empty: No debes tener datos en MySQL para usar el comando de importación.
        No-SQLite-File: No hay ningún archivo SQLite para importar.
        Updating-SQLite-Schema: El esquema de la base de datos SQLite está desactualizado, actualizando...
        Importing: Importando datos de SQLite a MySQL, por favor espera...
        Import-Complete: ¡Importación completada! ¡Por favor reinicia tu servidor para que se carguen los datos!
        Import-Failed: ¡Fallo en la importación! ¡Por favor inténtalo de nuevo!
      Hologram:
        Must-Have-DecentHolograms: Debes tener DecentHolograms instalado para usar este comando.
        Help:
        - 'Subcomandos disponibles:'
        - '&a/parkour hologram list&r - Listar todos los hologramas activos y sus IDs.'
        - '&a/parkour hologram create [id del parkour]&r - Colocar un holograma de tabla de líderes para el ID de parkour especificado, o general si no se especifica ninguno.'
        - '&a/parkour hologram delete [id del holograma]&r - Eliminar el holograma con el ID especificado.'
        List:
          Header: 'Todos los Hologramas Activos:'
          Line: '&aID: {id} &r- &a{parkour-name}'
          Footer: ''
        Create:
          Not-Valid-Parkour: Ese no es un ID de parkour válido. Si deseas ver una lista de todos los parkours y sus IDs, usa /parkour list.
          Not-Enough-Arguments: 'Argumentos inválidos. Argumentos correctos: &a/parkour hologram create [id del parkour]'
          Successful: Holograma creado exitosamente.
        Delete:
          Not-Valid-Hologram: Ese no es un ID de holograma válido. Si deseas ver una lista de todos los parkours y sus IDs, usa /parkour hologram list.
          Not-Enough-Arguments: 'Argumentos inválidos. Argumentos correctos: &a/parkour hologram delete [id del holograma]'
          Successful: Holograma eliminado exitosamente.
      Setup:
        Given-Setup-Stick: Se te ha dado el palo de configuración (setup stick).
        Please-Set-Start: |-
          ¡Bienvenido al asistente de configuración de parkour!

          Antes de empezar, ten en cuenta que el asistente usará tu ubicación como jugador al hacer clic para registrar posiciones, no hacia dónde miras al hacer clic con el palo. Cuando los jugadores usen comandos, se teletransportarán mirando en la dirección en la que estás al hacer clic.
          Para comenzar, haz clic con el palo donde te gustaría tu placa de presión de inicio. ¡No te preocupes por colocar ninguna placa, el plugin lo hará por ti! Si deseas cancelar en cualquier momento, escribe 'cancel' o usa /parkour cancel.
        Please-Set-End: ¡Punto de inicio establecido! Ahora, haz clic donde te gustaría tu placa de presión de fin con tu palo.
        Please-Set-Exit: ¡Punto de fin establecido! A continuación, debes establecer tu punto de salida. Haz clic con el palo mientras estás de pie en tu punto de salida. Puedes escribir 'none' para no tener ubicación de salida.
        Please-Set-Respawn: ¡Punto de salida establecido! A continuación, debes establecer tu punto de reaparición. Haz clic con el palo mientras estás de pie en tu punto de reaparición.
        Please-Set-Checkpoints: ¡Punto de reaparición establecido! Ahora, necesitas seleccionar los checkpoints que quieras. Haz clic en cada placa de presión de checkpoint, en el orden en que quieres que se completen, luego escribe 'done' o ejecuta /parkour done.
        Checkpoint-Added: Checkpoint añadido exitosamente. Si deseas añadir recompensas para este checkpoint en particular, escríbelas en el chat o usa /parkour input [comando]. Puedes especificar más de uno enviando comandos varias veces. Para continuar, añade otro checkpoint o escribe 'done' para terminar.
        Please-Set-Border: A continuación, debes establecer tus puntos de borde. Para hacerlo, haz clic con el palo mientras estás en la ubicación que deseas para tus puntos de borde. Si no deseas usar bordes, escribe 'done' o ejecuta /parkour done.
        Please-Set-Second-Border: ¡Genial, ahora establece tu segundo punto de borde! Si no deseas usar bordes, escribe 'done' o ejecuta /parkour done.
        Plates-Outside-Border:
          Restart: ¡Tu punto de reinicio está actualmente fuera de tu borde! ¡Por favor inténtalo de nuevo!
          End: ¡Tu punto de fin está actualmente fuera de tu borde! ¡Por favor inténtalo de nuevo!
          Start: ¡Tu punto de inicio está actualmente fuera de tu borde! ¡Por favor inténtalo de nuevo!
          Checkpoint: ¡Uno de tus checkpoints está actualmente fuera de tu borde! ¡Por favor inténtalo de nuevo!
        Please-Set-Name: ¡Ahora necesitas establecer un nombre para tu parkour! Por favor, escribe un nombre en el chat o usa /parkour input [nombre]. No debe ser un duplicado. Los nombres son compatibles con códigos de formato.
        Please-Set-End-Command: ¡El nombre ha sido establecido! Ahora escribe tus comandos de recompensa para el final de tu parkour en el chat o usa /parkour input [comando]. Puedes especificar más de uno enviando comandos varias veces. Cuando termines o si no quieres ninguno, escribe 'done'. Las variables disponibles son {player-uuid} y {player-name}.
        Please-Set-Checkpoint-Command: ¡Los comandos de fin han sido establecidos! Ahora escribe tus comandos de recompensa para todos los checkpoints en el chat o usa /parkour input [comando]. Puedes especificar más de uno enviando comandos varias veces. Este comando solo se ejecutará para cada checkpoint alcanzado una vez terminen el parkour para evitar trampas. Cuando termines o si no quieres uno, escribe 'done'. Las variables disponibles son {player-uuid} y {player-name}.
        Please-Set-Reward-Cooldown: Por favor, especifica un tiempo de espera (cooldown) para tus recompensas en horas (solo aplicable si tienes recompensas repetibles habilitadas). Si no deseas tener uno, escribe 'none'.
        Command-Added: ¡El comando ha sido añadido! Cuando termines, escribe 'done'.
        Invalid-Cooldown: Ese cooldown no es válido. Por favor inténtalo de nuevo. Si no deseas tener uno, escribe 'none'.
        Please-Set-GUI-Item: ¡Cooldown establecido! Especifica cómo quieres que se muestre en el menú GUI. Usa el formato MATERIAL:DATA:MODEL, donde MATERIAL es el tipo de ítem, DATA es un número, y MODEL es el número de dato de modelo personalizado (solo 1.14+, -1 para desactivar).
        Invalid-GUI-Item: Ese ítem para GUI no es válido. Por favor inténtalo de nuevo. Usa el formato MATERIAL:DATA:MODEL.
        Name-Taken: Ese nombre ya está en uso. Por favor inténtalo de nuevo.
        Invalid-Placement: El lugar donde intentas configurar ese punto está actualmente asignado a un tipo de punto diferente. Si es un error, escribe 'cancel' y reconfigura tu parkour.
        Is-Parkour-Global: ¡Ítem configurado con éxito! ¿Te gustaría que este parkour fuera global (aparezca en todos tus servidores)? Escribe 'y' para hacerlo global, o 'n' para hacerlo específico del servidor. Esto no se puede cambiar una vez creado el parkour.
        Setup-Complete: ¡Configuración del parkour completada!
        Setup-Cancelled: Se canceló la configuración del parkour. Cualquier punto que hayas configurado ha sido eliminado.
        Setup-Failed: Algo salió mal al intentar finalizar la configuración, así que el parkour no fue creado. ¡Por favor inténtalo de nuevo!
        Already-Someone-In-Setup: Alguien ya está configurando un parkour. Por favor, espera a que termine para configurar el tuyo.
        Exit-Skip:
          Please-Set-Respawn-Location: Ubicación de salida saltada. A continuación, debes establecer tu punto de reaparición. Haz clic con el palo mientras estás de pie en tu punto de reaparición.
        Must-Not-Be-In-Parkour: No debes estar en un parkour para poder configurarlo.
        Not-In-Setup: No estás actualmente en configuración. Si deseas configurar un parkour, usa /parkour setup.
        Setup:
          Please-Set-Checkpoints: ¡Punto de reaparición establecido! Ahora, necesitas seleccionar los checkpoints que quieras. Haz clic en cada placa de presión de checkpoint, en el orden en que quieres que se completen, luego escribe 'done'.
        Please-Select-GUI-Item: ¡Cooldown establecido! Especifica cómo quieres que se muestre en el menú GUI. Usa el formato MATERIAL:DATA:MODEL.
      Edit:
        Not-Valid-Parkour: Ese no es un parkour válido. Para ver una lista de parkours válidos, usa &a/parkour list&r.
        Someone-Already-Editing: Alguien ya está editando un parkour. Espera a que termine antes de editar otro.
        Already-Editing: Ya estás editando un parkour. Para editar otro, usa la opción 8 en el menú principal de edición para terminar de configurarlo.
        Not-Valid-Edit: Esa no es una edición válida. Por favor, escribe el número en el chat.
        Must-Be-Empty: El parkour debe estar vacío antes de que puedas editarlo.
        Entered-Edit-Mode: Has entrado al modo edición. Se te ha dado el palo de configuración.
        Exited-Edit-Mode: Has salido del modo edición.
        Choose-Edit:
        - Por favor selecciona qué te gustaría editar del parkour &a{parkour-name}&r. Escribe el dígito en el chat o usa /parkour input [número].
        - Ten en cuenta que los tiempos parciales se restablecerán tras modificar cualquier punto del parkour.
        - '&a1&r - Nombre'
        - '&a2&r - Ítem del GUI'
        - '&a3&r - Comandos del Final'
        - '&a4&r - Comandos Globales de Checkpoint'
        - '&a5&r - Punto de Inicio'
        - '&a6&r - Punto de Fin'
        - '&a7&r - Punto de Reinicio'
        - '&a8&r - Checkpoints'
        - '&a9&r - Puntos de Borde'
        - '&a10&r - Cooldown de Recompensas'
        - '&a11&r - Punto de Salida'
        - '&a12&r - Salir del Modo Edición'
        Choose-Checkpoint-Edit:
        - ¿Qué te gustaría editar de los checkpoints en el parkour &a{parkour-name}&r? Escribe el dígito en el chat o usa /parkour input [número].
        - '&a1&r - Eliminar Checkpoints'
        - '&a2&r - Añadir Checkpoints'
        - '&a3&r - Editar Recompensas de Checkpoint'
        - '&a4&r - Cancelar'
        Commands:
          List-Header: 'Tus comandos actuales de {type}:'
          List-No-Commands: Actualmente no tienes comandos configurados.
          List-Entry: '&a{number}&r - {command}'
          List-Footer: Si deseas eliminar un comando, escribe 1. Si deseas añadir nuevos comandos, escribe 2. Para cancelar, escribe 'cancel'.
          Delete-No-Commands: No puedes eliminar comandos porque no tienes ninguno configurado. Añade un comando o escribe 'cancel'.
          Select-Command: ¿Qué número de comando te gustaría eliminar? Escribe el número del comando de la lista de arriba. Escribe 'cancel' para cancelar.
          Command-Deleted: ¡Comando eliminado exitosamente!
          Not-Valid-Command: Ese no es un comando válido. Escribe el número del comando en el chat.
          Type-Command: Por favor, escribe tus nuevos comandos en el chat o usa /parkour input [comando]. Escribe 'done' cuando termines.
          Command-Added: ¡Comando añadido exitosamente! Escribe 'done' cuando termines.
        Enter-New-Name: Por favor, escribe un nuevo nombre para tu parkour en el chat o usa /parkour input [nombre]. No debe ser un duplicado.
        Name-Set: ¡Tu nuevo nombre ha sido establecido!
        Name-Taken: ¡Ese nombre ya está en uso! ¡Inténtalo de nuevo!
        Select-New-Start-Point: Usa el palo de configuración y selecciona un nuevo punto de inicio.
        Start-Point-Set: ¡Tu nuevo punto de inicio ha sido establecido!
        Select-New-End-Point: Usa el palo de configuración y selecciona un nuevo punto de fin.
        End-Point-Set: ¡Tu nuevo punto de fin ha sido establecido!
        Select-New-Restart-Point: Usa el palo de configuración y selecciona un nuevo punto de reinicio.
        Restart-Point-Set: ¡Tu nuevo punto de reinicio ha sido establecido!
        Select-First-Border-Point: Usa el palo de configuración y selecciona tu primer punto de borde. Si no deseas usar bordes, escribe 'done' o ejecuta /parkour done.
        Select-Second-Border-Point: Usa el palo de configuración y selecciona tu segundo punto de borde nuevo.
        Border-Updated: ¡Borde actualizado exitosamente!
        Outside-Border: ¡La nueva ubicación de tu placa está fuera de tu borde! Por favor, inténtalo de nuevo o ajusta tus puntos de borde primero.
        Plates-Outside-Border:
          Restart: ¡Tu punto de reinicio está actualmente fuera de tu borde! ¡Por favor inténtalo de nuevo!
          End: ¡Tu punto de fin está actualmente fuera de tu borde! ¡Por favor inténtalo de nuevo!
          Start: ¡Tu punto de inicio está actualmente fuera de tu borde! ¡Por favor inténtalo de nuevo!
          Checkpoint: ¡Uno de tus checkpoints está actualmente fuera de tu borde! ¡Por favor inténtalo de nuevo!
        Please-Set-Reward-Cooldown: Por favor, especifica un nuevo cooldown para tus recompensas en horas. Si no deseas tener uno, escribe 'none'.
        Invalid-Cooldown: Ese cooldown no es válido. Por favor inténtalo de nuevo. Si no deseas tener uno, escribe 'none'.
        Reward-Cooldown-Updated: ¡Cooldown de recompensas actualizado exitosamente!
        Item:
          Enter-Item: Por favor, especifica cómo quieres que se muestre el ítem en el GUI. Usa el formato MATERIAL:DATA:MODEL. Para cancelar, escribe 'cancel'.
          Invalid-GUI-Item: Ese ítem no es válido. Por favor inténtalo de nuevo. Usa el formato MATERIAL:DATA:MODEL.
          Successful: ¡Ítem establecido exitosamente!
        Checkpoints:
          Delete:
            No-Checkpoints: ¡Actualmente no hay checkpoints para eliminar! ¡Intenta añadir uno!
            Please-Enter-Checkpoint: ¿Qué número de checkpoint te gustaría eliminar? Escribe el número en el chat o usa /parkour input [nombre].
            Not-Valid-Checkpoint: Ese no es un checkpoint válido, por favor inténtalo de nuevo. Si deseas cancelar, escribe 'cancel'.
            Success: ¡Checkpoint eliminado exitosamente!
          Add:
            After-Which: ¿Después de qué checkpoint debe ir este? Escribe el número en el chat. Si quieres que sea el primero, escribe 0.
            Not-Valid: Ese checkpoint no es válido. Si quieres que sea el primero, escribe 0.
            Select-Checkpoint: Por favor, usa el palo de configuración y selecciona un nuevo checkpoint para añadir.
            Type-Rewards: Si deseas añadir recompensas para este checkpoint, escríbelas en el chat o usa /parkour input [comando]. Cuando termines, escribe 'done'.
            Command-Added: ¡Comando añadido exitosamente! Si terminaste, escribe 'done'.
            Success: ¡El checkpoint ha sido añadido exitosamente!
          Rewards:
            Select-Checkpoint: ¿Qué checkpoint te gustaría editar? Tienes {checkpoints} checkpoints. Escribe el número en el chat. Escribe 'cancel' para cancelar.
            Not-Valid: Ese checkpoint no es válido.
        Please-Set-Exit-Location: Por favor, usa el palo de configuración y selecciona la nueva Ubicación de Salida.
        Exit-Point-Already-Nothing: El punto de salida ya está configurado como nada.
        Exit-Point-Updated-None: Punto de salida borrado exitosamente.
        Exit-Point-Set: ¡Tu nuevo punto de salida ha sido establecido!
  Parkour:
    Started: ¡Has iniciado el parkour &a{parkour-name}&r!
    Restarted: ¡Has reiniciado el parkour! ¡Tu tiempo se ha restablecido a 0!
    Already-In-Parkour: Ya estás haciendo un parkour. Si deseas abandonarlo e iniciar uno nuevo, usa /parkour leave.
    Teleport: Has sido teletransportado a tu último checkpoint.
    Confirm-Action: Por favor, haz clic de nuevo en el ítem para confirmar.
    Currently-Being-Edited: Este parkour está siendo modificado por un admin. ¡Por favor, espera para intentarlo!
    Cannot-Execute-Commands: No puedes ejecutar comandos de otros plugins mientras haces un parkour. Para salir, usa /parkour leave.
    Cannot-Mount-In-Parkour: No puedes montar una entidad mientras estás en un parkour. Para salir, usa /parkour leave.
    Cannot-Stack-In-Parkour: No puedes apilar entidades mientras estás en un parkour. Para salir, usa /parkour leave.
